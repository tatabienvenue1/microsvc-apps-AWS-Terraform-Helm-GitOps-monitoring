{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.alb.targetType | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.alb.healthcheck.path | quote }}
    alb.ingress.kubernetes.io/healthcheck-protocol: {{ .Values.ingress.alb.healthcheck.protocol | quote }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: {{ .Values.ingress.alb.healthcheck.intervalSeconds | quote }}
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: {{ .Values.ingress.alb.healthcheck.timeoutSeconds | quote }}
    alb.ingress.kubernetes.io/healthy-threshold-count: {{ .Values.ingress.alb.healthcheck.healthyThresholdCount | quote }}
    alb.ingress.kubernetes.io/unhealthy-threshold-count: {{ .Values.ingress.alb.healthcheck.unhealthyThresholdCount | quote }}
    alb.ingress.kubernetes.io/success-codes: {{ .Values.ingress.alb.healthcheck.successCodes | quote }}
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.alb.certificateArn must be set to your ACM certificate ARN (same region as the ALB)" .Values.ingress.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.ingress.alb.listenPorts | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.alb.sslRedirect | quote }}
    {{- if .Values.ingress.alb.subnets }}
    alb.ingress.kubernetes.io/subnets: {{ .Values.ingress.alb.subnets | quote }}
    {{- end }}
    {{- range $k, $v := .Values.ingress.alb.extraAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ required "ingress.host must be set to your public hostname (e.g. shop.example.com)" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
